# Optional CPU inference. qwen2.5:0.5b is loaded only while generating briefings.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: lift-ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: lift-ai
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ollama
          image: ollama/ollama:latest
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: '0'}
            - {name: OLLAMA_NUM_PARALLEL, value: '1'}
            - {name: OLLAMA_MAX_LOADED_MODELS, value: '1'}
            - {name: OLLAMA_CONTEXT_LENGTH, value: '2048'}
          ports:
            - {containerPort: 11434}
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe:
            httpGet: {path: /api/tags, port: 11434}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: ollama-models}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: lift-ai
spec:
  selector: {app: ollama}
  ports:
    - {port: 11434, targetPort: 11434}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-internal-only
  namespace: lift-ai
spec:
  podSelector:
    matchLabels: {app: ollama}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: backend}
      ports:
        - {protocol: TCP, port: 11434}
